# ==============================================================================
# CloudPanel Nginx Vhost Hardening: Modern SSL & DDoS Rate Limiting
# Áp dụng trong: CloudPanel > Sites > phuoc-nodejs.sixforce.io.vn > Vhost Editor
# ==============================================================================

# 1. Giới hạn Rate Limiting ở tầng Nginx (Chống DDoS / Flood request)
# (Đặt ở đầu file Vhost hoặc khối http)
limit_req_zone $binary_remote_addr zone=cp_req_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=cp_conn_limit:10m;

server {
  listen 80;
  listen [::]:80;
  server_name phuoc-nodejs.sixforce.io.vn *.sixforce.io.vn;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name phuoc-nodejs.sixforce.io.vn *.sixforce.io.vn;

  # --- CẤU HÌNH SSL BẢO MẬT CAO NHẤT (TLS 1.2 & TLS 1.3) ---
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  
  # Cipher Suites hiện đại (Mozilla Intermediate / High Security)
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

  # Tối ưu hóa phiên làm việc SSL Session Cache & Tickets
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:50m;
  ssl_session_tickets off;

  # Bật OCSP Stapling tăng tốc độ bắt tay SSL
  ssl_stapling on;
  ssl_stapling_verify on;
  resolver 8.8.8.8 1.1.1.1 valid=300s;
  resolver_timeout 5s;

  # --- SECURITY HEADERS ---
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # --- CHỐNG TẤN CÔNG & DDOS ---
  limit_req zone=cp_req_limit burst=40 nodelay;
  limit_conn cp_conn_limit 20;

  client_body_buffer_size 128k;
  client_max_body_size 10m;
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;

  # Proxy ngược về ứng dụng Node.js chạy PM2 trên port 3000
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }
}
